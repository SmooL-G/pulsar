services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pulsar-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PLATFORM_WALLET: ${PLATFORM_WALLET_ADDRESS}
    container_name: pulsar-web
    restart: unless-stopped
    ports:
      - "5173:80"
