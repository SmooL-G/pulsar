services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsar
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsar-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: pulsar-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    container_name: pulsar-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb --ignore-existing myminio/pulsar-files;
      mc anonymous set download myminio/pulsar-files/avatars;
      echo 'Bucket initialized';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pulsar-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Production uses external managed DB + Redis at 10.100.16.177
      # (set via DATABASE_URL / REDIS_URL in .env).
      # The postgres/redis compose services stay defined for local dev,
      # but server picks up the URLs from the host .env.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Production uses Cloudflare R2 (configured via S3_* in .env).
      # The minio compose service is kept only for local dev — server
      # talks to R2 directly through S3_ENDPOINT / S3_PUBLIC_URL.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_NETWORK: devnet
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      WALLET_ENCRYPTION_SALT: ${WALLET_ENCRYPTION_SALT}
      PLATFORM_WALLET_ADDRESS: ${PLATFORM_WALLET_ADDRESS}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_RELAY_URL: ${WHISPER_RELAY_URL:-}
      WHISPER_RELAY_TOKEN: ${WHISPER_RELAY_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # TURN credentials endpoint (/api/v1/turn/credentials) signs with
      # the same secret coturn validates against. TURN_PUBLIC_HOST is
      # the hostname clients will use as turn:<host>:3478.
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-pulsar-chat.fun}
      # Relay tunnel feature: shared secret for the relay container's
      # heartbeat endpoint, plus the public host the relay is reachable
      # at (used to synthesise wss://<host>/n/<id> for tunneled nodes).
      RELAY_HEARTBEAT_SECRET: ${RELAY_HEARTBEAT_SECRET}
      PUBLIC_RELAY_HOST: ${PUBLIC_RELAY_HOST:-pulsar-chat.fun}
      # Miner-storage rollout phase. 0 = off, 1 = dual-write (Postgres
      # AND nodes), 2 = dual-read opt-in beta, 3 = production, 4 = pure
      # miner storage. See docs/MINER_STORAGE.md.
      MINER_STORAGE_PHASE: ${MINER_STORAGE_PHASE:-0}
      RELAY_ADMIN_URL: ${RELAY_ADMIN_URL:-ws://relay:3030/_admin/tunnel-ws}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PLATFORM_WALLET: ${PLATFORM_WALLET_ADDRESS}
    container_name: pulsar-web
    restart: unless-stopped
    ports:
      - "5173:80"

  # Stateless WebRTC signaling relay (Pulsar P2P Phase 2). Doesn't touch
  # the DB or Redis. Anyone can run a relay; this is the reference one
  # operated by the project. See apps/relay/src/index.ts for protocol.
  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    container_name: pulsar-relay
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      PORT: 3030
      HOST: 0.0.0.0
      AUTH_BASE_URL: "http://server:3001"
      RELAY_HEARTBEAT_SECRET: "${RELAY_HEARTBEAT_SECRET}"
    depends_on:
      - server

  # TURN server for WebRTC media relay when symmetric NAT prevents
  # direct P2P. Used by the Phase-2/3 voice/video paths and by clients
  # whose ISP blocks UDP hole punching. coturn with REST-API ephemeral
  # creds — server signs (username, password) pairs; turnserver verifies
  # via shared TURN_AUTH_SECRET. See apps/turn/turnserver.conf.
  turn:
    build:
      context: .
      dockerfile: apps/turn/Dockerfile
    container_name: pulsar-turn
    restart: unless-stopped
    network_mode: host  # coturn needs the real public IP for ICE candidates
    environment:
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET}

volumes:
  pgdata:
  redisdata:
  miniodata:
