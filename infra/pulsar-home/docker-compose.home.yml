# Pulsar Home — single-machine, self-hosted stack for a personal device
# (Raspberry Pi 4/5 or x86 mini-PC). Runs the full chat server + DB + cache
# + object storage + node-agent on one box.
#
# Differences vs docker-compose.prod.yml:
#   * No `relay` / `turn` — those stay on the coordinator (pulsar-chat.fun)
#   * No external DB/Redis URLs — bundled locally
#   * Bind mounts under /var/lib/pulsar-home so user knows where data lives
#   * Adds `pulsar-node-agent` for ATECC heartbeats + shard storage
#   * Adds `caddy` as LAN-facing reverse proxy (pulsar.local)
#   * Binds to 0.0.0.0 — anyone on the LAN can hit it
#
# Multi-arch: all base images (postgres:16-alpine, redis:7-alpine,
# nginx:alpine, caddy:alpine, minio/minio, node:20) ship linux/arm64
# manifests, so `docker compose build` works unchanged on RPi.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsar-home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsar
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${PULSAR_HOME_DATA:-/var/lib/pulsar-home}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsar-home

  redis:
    image: redis:7-alpine
    container_name: pulsar-home-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - ${PULSAR_HOME_DATA:-/var/lib/pulsar-home}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsar-home

  minio:
    image: minio/minio
    container_name: pulsar-home-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ${PULSAR_HOME_DATA:-/var/lib/pulsar-home}/minio:/data
    networks:
      - pulsar-home

  minio-init:
    image: minio/mc
    container_name: pulsar-home-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb --ignore-existing myminio/pulsar-files;
      mc anonymous set download myminio/pulsar-files/avatars;
      echo 'Bucket initialized';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks:
      - pulsar-home

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: pulsar-home-server
    restart: unless-stopped
    environment:
      INSTANCE_ROLE: home
      INSTANCE_ID: ${HOME_INSTANCE_ID}
      COORDINATOR_URL: ${COORDINATOR_URL:-https://pulsar-chat.fun}
      DATABASE_URL: postgresql://pulsar:${DB_PASSWORD}@postgres:5432/pulsar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: pulsar-files
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://pulsar.local/media}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://pulsar.local}
      WALLET_ENCRYPTION_SALT: ${WALLET_ENCRYPTION_SALT}
      PLATFORM_WALLET_ADDRESS: ${PLATFORM_WALLET_ADDRESS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@pulsar.local}
      SMTP_FROM: ${SMTP_FROM:-noreply@pulsar.local}
      # Disabled-by-default modules for home edition
      MINER_STORAGE_PHASE: "0"
      FAKE_ACTIVITY_ENABLED: "false"
      KIE_API_KEY: ${KIE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pulsar-home

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PLATFORM_WALLET: ${PLATFORM_WALLET_ADDRESS}
    container_name: pulsar-home-web
    restart: unless-stopped
    networks:
      - pulsar-home

  # Pulsar Home node-agent: signs heartbeats with ATECC608B and reports
  # to the coordinator, hosts shards of other users' encrypted keys.
  # See infra/pulsar-home/node-agent/ for implementation (Phase 2).
  # For Phase 1 this is a stub container that mock-signs and posts.
  node-agent:
    build:
      context: ./node-agent
      dockerfile: Dockerfile
    container_name: pulsar-home-node-agent
    restart: unless-stopped
    privileged: true   # needs /dev/i2c-1 for ATECC608B (RPi only)
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      COORDINATOR_URL: ${COORDINATOR_URL:-https://pulsar-chat.fun}
      INSTANCE_ID: ${HOME_INSTANCE_ID}
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-30}
      MOCK_SIGN: ${MOCK_SIGN:-true}  # set false once ATECC is wired up
      SHARD_STORE_DIR: /var/lib/pulsar-home/shards
    volumes:
      - ${PULSAR_HOME_DATA:-/var/lib/pulsar-home}/shards:/var/lib/pulsar-home/shards
    depends_on:
      server:
        condition: service_healthy
    networks:
      - pulsar-home

  # LAN reverse proxy. Routes pulsar.local -> web/server, exposes the
  # node-agent status under /node/. On v1 we run HTTP-only on the LAN
  # (browsers won't trust a self-signed cert for .local without manual
  # CA install). v2 will use Caddy's internal CA + a setup-wizard step
  # that installs the cert into the user's device trust store.
  caddy:
    image: caddy:2-alpine
    container_name: pulsar-home-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PULSAR_HOME_DATA:-/var/lib/pulsar-home}/caddy:/data
    depends_on:
      - web
      - server
    networks:
      - pulsar-home

networks:
  pulsar-home:
    driver: bridge
