# Pulsar TURN — coturn config tuned for ephemeral REST-API credentials.
# Browser clients fetch a short-lived (username, password) pair from
# /api/v1/turn/credentials and pass it to RTCPeerConnection. The TURN
# server validates the password as HMAC-SHA1(static-auth-secret, username).

listening-port=3478
tls-listening-port=5349

# Pulsar is single-tenant, no multi-realm needed.
realm=pulsar-chat.fun

# REST-API ephemeral credentials. Keep this secret in sync with the
# TURN_AUTH_SECRET env var the API server uses to sign credentials.
use-auth-secret
static-auth-secret=${TURN_AUTH_SECRET}

# Relay UDP/TCP. We DON'T enable TLS yet (no certs in container);
# wss-grade transport will land in v2 once we wire Let's Encrypt.
no-tls
no-dtls

# Keep relay port range narrow — easier for firewall rules / VPS
# providers that limit open UDP ports.
min-port=49152
max-port=49200

# Logging: stdout-friendly so docker logs see it.
log-file=stdout
verbose

# Privacy / abuse: drop loopback and multicast destinations so the
# server can't be used to attack internal services.
no-loopback-peers
no-multicast-peers

# Bandwidth cap per allocation (bits/s). 1 Mbit lets voice/video flow
# but stops a single user from saturating the link.
max-bps=1048576
