server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-y assets. The Vite bundle is ~1.5 MB uncompressed; without
    # this it crosses HTTP/2 frame limits on the upstream myjino TLS proxy and
    # bigger downloads die with ERR_HTTP2_PROTOCOL_ERROR. With gzip the same
    # bundle is ~350 KB and ships cleanly.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
