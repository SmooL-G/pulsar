name: Init Android Keystore (one-time)

# Manually triggered one-time helper that generates a fresh keystore,
# prints the values you need to paste into repo Secrets, and prints the
# SHA256 fingerprint you need to put into apps/web/public/.well-known/assetlinks.json.
# After this run completes, copy the values from the run log, then DELETE this
# workflow file (or leave it — it requires manual dispatch and won't run on its own).

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias inside the keystore'
        required: true
        default: pulsar
      keystore_password:
        description: 'Password for the keystore file (you choose; will go to ANDROID_KEYSTORE_PASSWORD secret)'
        required: true
      key_password:
        description: 'Password for the alias key (you choose; will go to ANDROID_KEY_PASSWORD secret)'
        required: true
      cn:
        description: 'Common Name for the certificate (e.g. "Pulsar Chat")'
        required: true
        default: Pulsar Chat
      org:
        description: 'Organization (e.g. "Pulsar")'
        required: true
        default: Pulsar
      country:
        description: 'Country code (e.g. RU, US)'
        required: true
        default: RU

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KS_PW: ${{ github.event.inputs.keystore_password }}
          KEY_PW: ${{ github.event.inputs.key_password }}
          ALIAS: ${{ github.event.inputs.key_alias }}
          CN: ${{ github.event.inputs.cn }}
          ORG: ${{ github.event.inputs.org }}
          COUNTRY: ${{ github.event.inputs.country }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PW" \
            -keypass "$KEY_PW" \
            -dname "CN=$CN, O=$ORG, C=$COUNTRY"

      - name: Extract SHA256 fingerprint
        env:
          KS_PW: ${{ github.event.inputs.keystore_password }}
          ALIAS: ${{ github.event.inputs.key_alias }}
        run: |
          echo "============================================================"
          echo "  SHA256 fingerprint (paste into assetlinks.json):"
          echo "============================================================"
          keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$KS_PW" \
            | grep "SHA256:" \
            | head -1 \
            | sed 's/^.*SHA256: //'
          echo "============================================================"

      - name: Encode keystore as base64
        run: |
          echo "============================================================"
          echo "  ANDROID_KEYSTORE_BASE64 secret value (one long line below):"
          echo "============================================================"
          base64 -w0 android.keystore
          echo
          echo "============================================================"

      - name: Upload keystore as artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-DO-NOT-LOSE
          path: android.keystore
          retention-days: 90
