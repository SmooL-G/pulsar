name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            # Stick with 22.04 — 24.04 ships webkit2gtk-4.1 only and
            # Tauri 2 default templates still expect 4.0 paths through
            # tauri-driver / glib bindings. Saves a class of dep hell.
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri'

      - name: Install Linux build dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev

      # Generate icons via tauri CLI before tauri-action runs the build.
      # tauri-action installs its own CLI, so we install the JS one
      # locally (small package, ~2 MB) just for `tauri icon`.
      - name: Generate icons
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund @tauri-apps/cli@^2.1.0
          npx @tauri-apps/cli icon ../../apps/web/public/icons/icon-512.png

      - name: Build + release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Pulsar Desktop ${{ github.ref_name }}'
          releaseBody: |
            Pulsar Desktop relay node — ${{ github.ref_name }}

            **Install (Windows):** download the `.exe` (NSIS installer) or `.msi` and run.

            **Install (Linux):** download the `.deb` and `sudo dpkg -i pulsar-desktop_*_amd64.deb`.

            See the [README](https://github.com/SmooL-G/pulsar/blob/main/apps/desktop/README.md) for setup.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
