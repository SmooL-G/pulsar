name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'   # tag like desktop-v0.1.0 to trigger
  workflow_dispatch:    # allow manual run

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: msi
          - platform: ubuntu-latest
            target: deb
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Install Tauri CLI + generate icons
        working-directory: apps/desktop
        run: |
          npm install
          npx @tauri-apps/cli icon ../../apps/web/public/icons/icon-512.png

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx @tauri-apps/cli build

      - name: List artifacts (debug)
        if: always()
        run: |
          ls -R apps/desktop/src-tauri/target/release/bundle 2>/dev/null || dir apps\desktop\src-tauri\target\release\bundle
        shell: bash

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
