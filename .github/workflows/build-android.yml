name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 0.1.0). Leave empty to use twa-manifest.json value.'
        required: false
      version_code:
        description: 'Version code (integer). Leave empty to use twa-manifest.json value.'
        required: false
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Pre-seed Bubblewrap config (skip interactive JDK/SDK prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Wrote bubblewrap config:"
          cat ~/.bubblewrap/config.json

      - name: Bubblewrap doctor (diagnostic)
        run: bubblewrap doctor || true

      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See android/README.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/android.keystore
          ls -la android/android.keystore

      - name: Override version from workflow inputs (if provided)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VN='${{ github.event.inputs.version_name }}'
          VC='${{ github.event.inputs.version_code }}'
          if [ -n "$VN" ]; then
            jq --arg v "$VN" '.appVersionName = $v' android/twa-manifest.json > /tmp/m.json && mv /tmp/m.json android/twa-manifest.json
          fi
          if [ -n "$VC" ]; then
            jq --argjson v "$VC" '.appVersionCode = $v' android/twa-manifest.json > /tmp/m.json && mv /tmp/m.json android/twa-manifest.json
          fi
          echo "Effective version:"; jq '{appVersionName, appVersionCode}' android/twa-manifest.json

      - name: Override version from tag (push tag path)
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          TAG=${GITHUB_REF#refs/tags/android-v}
          # Tag format: android-v0.1.2 → versionName=0.1.2, versionCode = 102 (major*10000 + minor*100 + patch)
          IFS='.' read -r MAJ MIN PATCH <<< "$TAG"
          VC=$(( MAJ * 10000 + MIN * 100 + PATCH ))
          jq --arg vn "$TAG" --argjson vc "$VC" '.appVersionName = $vn | .appVersionCode = $vc' android/twa-manifest.json > /tmp/m.json && mv /tmp/m.json android/twa-manifest.json
          echo "Tag-derived version: $TAG ($VC)"

      - name: Install @bubblewrap/core for headless project gen
        working-directory: android
        run: npm install --no-audit --no-fund

      - name: Generate Android project from manifest (headless)
        working-directory: android
        run: npm run generate

      - name: Write keystore.properties for Gradle signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/android.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties written (passwords masked)"

      - name: Build signed release APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Locate built APK
        id: apk
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            ls -R app/build/outputs 2>/dev/null | head -40 || ls -la
            exit 1
          fi
          VN=$(jq -r '.appVersionName' twa-manifest.json)
          NEW_NAME="pulsar-${VN}.apk"
          cp "$APK" "$NEW_NAME"
          echo "path=android/$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "Built: $NEW_NAME ($(du -h "$NEW_NAME" | cut -f1))"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: Android ${{ github.ref_name }}
          body: |
            Pulsar Android — TWA wrapper of https://pulsar-chat.fun

            Install the APK directly. The web app updates over the network, so a fresh APK is only needed when the wrapper itself changes (icons, package id, permissions).
